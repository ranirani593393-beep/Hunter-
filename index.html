<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUNTER</title>
<meta name="theme-color" content="#0a0907">
<meta name="description" content="Find your next domain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0907; --ink:#f2ece0; --mute:#8f887b; --gold:#c9a96a; --gold-dim:#8a7347;
  --ease:cubic-bezier(.22,.8,.24,1);
  --font:'Manrope','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1px solid var(--gold);outline-offset:6px}
.wrap{min-height:100%;max-width:880px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 28px max(48px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex;animation:in .7s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* wordmark */
.mark{font-weight:800;letter-spacing:.34em;margin-right:-.34em;line-height:1;color:var(--ink);text-transform:uppercase;position:relative;display:inline-block}
.mark.lg{font-size:clamp(44px,11vw,104px)}
.mark.sm{font-size:15px;letter-spacing:.42em;color:var(--gold)}
.mark i{font-style:normal;display:inline-block}

/* intro */
#intro{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .8s var(--ease),visibility .8s}
#intro.off{opacity:0;visibility:hidden}
#intro .mark i{opacity:0;transform:translateY(40%);filter:blur(8px);animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--n)*70ms + 150ms)}
#intro .mark::after{content:"";position:absolute;left:0;right:.34em;bottom:-18px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);animation:line 1.1s var(--ease) .75s forwards}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
@keyframes line{to{transform:scaleX(1)}}

/* input */
#v-in{justify-content:center;gap:clamp(28px,6vh,56px)}
.head{display:flex;flex-direction:column;gap:18px}
.tag{font-weight:300;font-size:clamp(17px,2.4vw,22px);color:var(--mute);letter-spacing:.02em}
.field{position:relative}
textarea{width:100%;height:min(38vh,320px);min-height:180px;resize:none;background:transparent;border:0;color:var(--ink);font:300 clamp(20px,3vw,28px)/1.7 var(--font);letter-spacing:.01em;padding:14px 0 14px 22px;border-left:1px solid #2a2620;transition:border-color .5s var(--ease)}
textarea::placeholder{color:#4a463e}
textarea:focus{outline:0;border-left-color:var(--gold)}
.row{display:flex;align-items:center;gap:24px;flex-wrap:wrap;min-height:56px}
.go{font-weight:800;font-size:13px;letter-spacing:.3em;color:var(--bg);background:var(--gold);padding:20px 34px;min-height:56px;transition:transform .25s var(--ease),background .4s}
.go:hover{background:#dcc084}
.go:active{transform:scale(.97)}
.msg{font-size:14px;color:var(--mute);letter-spacing:.02em;min-height:20px}

/* results */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(36px,8vh,72px)}
.lnk{font-size:13px;font-weight:500;letter-spacing:.22em;color:var(--mute);padding:14px 0;min-height:48px;transition:color .3s}
.lnk:hover,.lnk:focus-visible{color:var(--gold)}
h1{font-weight:300;font-size:clamp(30px,5.5vw,52px);letter-spacing:-.01em;line-height:1.1}
.count{margin-top:12px;font-size:14px;color:var(--mute)}
.sec{margin-top:clamp(36px,6vh,56px)}
.sec h2{font-weight:500;font-size:13px;letter-spacing:.24em;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;min-height:48px}
.sec.av h2{color:var(--gold)}
ul{list-style:none}
li{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid #1a1814;min-height:64px;animation:in .6s var(--ease) both;animation-delay:calc(var(--i)*35ms)}
.dn{font-size:clamp(18px,2.8vw,24px);font-weight:400;letter-spacing:.01em;word-break:break-all}
.st{font-size:12px;font-weight:500;letter-spacing:.2em;color:var(--gold);white-space:nowrap}
.un .dn{color:var(--mute);font-weight:300}
.un .st,.bad .st{color:#5d584e}
.bad .dn{color:var(--ink);font-weight:300}
.r{display:flex;align-items:center;gap:22px}
.buy{font-weight:800;font-size:12px;letter-spacing:.26em;color:var(--gold);border-bottom:1px solid var(--gold-dim);padding:14px 0 6px;min-height:44px;display:inline-flex;align-items:flex-end;text-decoration:none;transition:color .3s,border-color .3s}
.buy:hover,.buy:focus-visible{color:var(--ink);border-color:var(--ink)}
.why{font-size:12px;color:var(--mute);display:block;margin-top:4px;letter-spacing:.02em}

/* loading */
#v-load{justify-content:center;align-items:flex-start;gap:30px}
.ld{font-weight:800;font-size:clamp(44px,11vw,104px);letter-spacing:.34em;line-height:1;text-transform:uppercase;color:#1f1c17;position:relative;display:inline-block;white-space:nowrap}
.ld b{position:absolute;left:0;top:0;color:var(--gold);overflow:hidden;white-space:nowrap;width:0;transition:width .9s var(--ease);font-weight:800}
.bar{width:100%;max-width:520px;height:1px;background:#1f1c17;position:relative;overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .9s var(--ease)}
.bar::before{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(242,236,224,.55),transparent);animation:sweep 2.2s linear infinite;z-index:1}
@keyframes sweep{from{left:-30%}to{left:100%}}
.prog{font-size:15px;color:var(--mute);letter-spacing:.06em;font-variant-numeric:tabular-nums;min-height:22px}
.prog span{color:var(--ink)}
.cur{font-size:13px;color:#5d584e;min-height:20px;letter-spacing:.04em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  #intro .mark i{opacity:1;transform:none;filter:none}
  .bar::before{display:none}
}
@media (max-width:520px){.wrap{padding-left:20px;padding-right:20px}.go{width:100%;text-align:center}.r{gap:14px}}
</style>
</head>
<body>

<div id="intro" aria-hidden="true"><span class="mark lg" id="introMark"></span></div>

<main class="wrap">

  <section class="view on" id="v-in" aria-label="Domain input">
    <div class="head">
      <h1 class="mark lg" style="font-weight:800;font-size:clamp(44px,11vw,104px);letter-spacing:.34em">Hunter</h1>
      <p class="tag">Find your next domain.</p>
    </div>
    <div class="field">
      <label class="sr" for="domains">Domain names</label>
      <textarea id="domains" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Enter domain names, one per line…&#10;futurebrand.com&#10;mycompany.ai&#10;nextworld.io&#10;brandname.co"></textarea>
    </div>
    <div class="row">
      <button class="go" id="check" type="button">CHECK AVAILABILITY</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section class="view" id="v-load" aria-label="Checking domains">
    <div class="ld" aria-hidden="true">Hunter<b id="ldFill">Hunter</b></div>
    <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    <p class="prog" id="prog" aria-live="polite"></p>
    <p class="cur" id="cur"></p>
  </section>

  <section class="view" id="v-out" aria-label="Results">
    <div class="top">
      <span class="mark sm">HUNTER</span>
      <button class="lnk" id="back" type="button">BACK</button>
    </div>
    <h1>Your domain results.</h1>
    <p class="count" id="count"></p>
    <div id="out"></div>
  </section>

</main>

<script>
(() => {
  'use strict';
  const WORKER = 'https://raspy-mud-f138.mohammadnasimb2b.workers.dev';
  const GAP_MS = 1100;          // ~1 request per second
  const MAX_RETRIES = 3;        // per domain, for 429 / temporary failures
  const TIMEOUT_MS = 15000;

  const $ = id => document.getElementById(id);
  const views = { in: $('v-in'), load: $('v-load'), out: $('v-out') };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let items = [];     // {display, ascii, state:'pending'|'available'|'unavailable'|'failed', reason}
  let invalid = [];
  let runId = 0;

  /* ---------- intro ---------- */
  const im = $('introMark');
  'HUNTER'.split('').forEach((c, n) => {
    const s = document.createElement('i'); s.textContent = c; s.style.setProperty('--n', n); im.appendChild(s);
  });
  setTimeout(() => $('intro').classList.add('off'), reduced ? 300 : 1900);

  /* ---------- view switching ---------- */
  function show(name) {
    Object.entries(views).forEach(([k, v]) => v.classList.toggle('on', k === name));
    window.scrollTo(0, 0);
  }

  /* ---------- input parsing ---------- */
  function normalise(raw) {
    let s = raw.trim().toLowerCase()
      .replace(/^[a-z][a-z0-9+.-]*:\/\//, '')   // strip scheme
      .replace(/^www\./, '')
      .replace(/[\/?#].*$/, '')                  // strip path
      .replace(/\.$/, '');
    if (!s) return null;
    let ascii;
    try { ascii = new URL('http://' + s).hostname; } catch { return { display: s, bad: true }; }
    const labels = ascii.split('.');
    const ok = labels.length >= 2 &&
      labels.every(l => l.length >= 1 && l.length <= 63 && /^[a-z0-9-]+$/.test(l) && !/^-|-$/.test(l)) &&
      /^([a-z]{2,63}|xn--[a-z0-9-]{1,59})$/.test(labels[labels.length - 1]) &&
      ascii.length <= 253;
    let display = s;
    try { if (ascii.includes('xn--')) display = s; } catch {}
    return { display, ascii, bad: !ok };
  }

  function parse(text) {
    const seen = new Set(), good = [], bad = [];
    text.split(/[\s,;]+/).forEach(tok => {
      const n = normalise(tok);
      if (!n) return;
      if (n.bad) { if (!bad.includes(n.display)) bad.push(n.display); return; }
      if (seen.has(n.ascii)) return;
      seen.add(n.ascii);
      good.push({ display: n.display, ascii: n.ascii, state: 'pending', reason: '' });
    });
    return { good, bad };
  }

  /* ---------- checking ---------- */
  async function checkOne(it, id) {
    for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
      if (id !== runId) return;
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), TIMEOUT_MS);
      try {
        const res = await fetch(`${WORKER}/?domain=${encodeURIComponent(it.ascii)}`, { signal: ctl.signal, headers: { Accept: 'application/json' } });
        clearTimeout(t);
        if (res.status === 429 || res.status >= 500) {
          if (attempt < MAX_RETRIES) {
            const ra = parseFloat(res.headers.get('Retry-After'));
            await sleep((isFinite(ra) ? ra * 1000 : 2500 * Math.pow(2, attempt)) + 300);
            continue;
          }
          it.state = 'failed';
          it.reason = res.status === 429 ? 'Rate limit reached' : `Server error (${res.status})`;
          return;
        }
        if (!res.ok) { it.state = 'failed'; it.reason = `Request failed (${res.status})`; return; }
        let data;
        try { data = await res.json(); } catch { it.state = 'failed'; it.reason = 'Invalid response'; return; }
        if (!data || typeof data.available !== 'boolean') { it.state = 'failed'; it.reason = 'Incomplete response'; return; }
        it.state = data.available ? 'available' : 'unavailable';
        it.reason = '';
        return;
      } catch (e) {
        clearTimeout(t);
        if (attempt < MAX_RETRIES) { await sleep(1500 * (attempt + 1)); continue; }
        it.state = 'failed';
        it.reason = e.name === 'AbortError' ? 'Request timed out' : 'Network error';
        return;
      }
    }
  }

  async function run(list) {
    const id = ++runId;
    const total = list.length;
    let done = 0;
    show('load');
    const upd = () => {
      const p = total ? done / total : 0;
      $('bar').style.setProperty('--p', p);
      $('bar').setAttribute('aria-valuenow', Math.round(p * 100));
      $('ldFill').style.width = (p * 100) + '%';
      $('prog').innerHTML = `<span>${done}</span> / ${total} checked`;
    };
    upd();
    for (let i = 0; i < list.length; i++) {
      if (id !== runId) return;
      $('cur').textContent = list[i].display;
      const started = Date.now();
      await checkOne(list[i], id);
      if (id !== runId) return;
      done++; upd();
      const wait = GAP_MS - (Date.now() - started);
      if (i < list.length - 1 && wait > 0) await sleep(wait);
    }
    if (id !== runId) return;
    await sleep(reduced ? 0 : 700);
    render();
    show('out');
  }

  /* ---------- rendering ---------- */
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const buyUrl = d => 'https://www.godaddy.com/domainsearch/find?domainToCheck=' + encodeURIComponent(d);

  function section(cls, title, rows, extra = '') {
    if (!rows.length) return '';
    return `<div class="sec ${cls}"><h2><span>${title} (${rows.length})</span>${extra}</h2><ul>${rows.join('')}</ul></div>`;
  }

  function render() {
    const av = items.filter(i => i.state === 'available');
    const un = items.filter(i => i.state === 'unavailable');
    const bad = items.filter(i => i.state === 'failed');
    $('count').textContent = `${items.length} domain${items.length === 1 ? '' : 's'} checked`;

    const row = (i, n, right, sub = '') =>
      `<li style="--i:${Math.min(n, 20)}"><div><span class="dn">${esc(i.display)}</span>${sub}</div><div class="r">${right}</div></li>`;

    let html = '';
    html += section('av', 'AVAILABLE', av.map((i, n) => row(i, n,
      `<span class="st">AVAILABLE</span><a class="buy" href="${buyUrl(i.ascii)}" target="_blank" rel="noopener noreferrer" aria-label="Buy ${esc(i.display)} on GoDaddy">BUY</a>`)));
    html += section('un', 'UNAVAILABLE', un.map((i, n) => row(i, n, `<span class="st">UNAVAILABLE</span>`)));
    html += section('bad', 'FAILED / COULD NOT CHECK', bad.map((i, n) => row(i, n,
      `<span class="st">NOT CHECKED</span>`, `<span class="why">${esc(i.reason)}</span>`)),
      `<button class="lnk" id="retry" type="button">RETRY ALL</button>`);
    if (invalid.length) {
      html += section('bad', 'SKIPPED — INVALID', invalid.map((d, n) =>
        `<li style="--i:${Math.min(n, 20)}"><span class="dn">${esc(d)}</span><span class="st">INVALID</span></li>`));
    }
    $('out').innerHTML = html;
    const rb = $('retry');
    if (rb) rb.addEventListener('click', () => run(items.filter(i => i.state === 'failed')));
  }

  /* ---------- events ---------- */
  const ta = $('domains'), msg = $('msg');
  function start() {
    const { good, bad } = parse(ta.value);
    if (!ta.value.trim()) { msg.textContent = 'Enter at least one domain name.'; ta.focus(); return; }
    if (!good.length) { msg.textContent = 'No valid domains found. Use a format like example.com.'; ta.focus(); return; }
    msg.textContent = '';
    items = good; invalid = bad;
    run(items);
  }
  $('check').addEventListener('click', start);
  ta.addEventListener('input', () => { msg.textContent = ''; });
  ta.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') start(); });
  $('back').addEventListener('click', () => { runId++; show('in'); ta.focus({ preventScroll: true }); });
})();
</script>
</body>
</html>
